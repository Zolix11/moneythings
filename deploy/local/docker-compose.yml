# Ghostfolio on the Mac until it has a real host. Builds this fork from source.
#
#   cd deploy/local && docker compose up -d --build
#   open http://localhost:3333
name: moneythings

services:
  ghostfolio:
    build: ../..
    image: moneythings:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ghostfolio:${POSTGRES_PASSWORD}@postgres:5432/ghostfolio?connect_timeout=300
      REDIS_HOST: redis
      # lets Claude read the portfolio at /mcp with an access token
      ENABLE_FEATURE_MCP: 'true'
      ROOT_URL: http://localhost:3333
    ports:
      - 127.0.0.1:3333:3333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3333/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 1m

  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ghostfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ghostfolio
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ghostfolio -d ghostfolio']
      interval: 10s
      timeout: 5s
      retries: 10

  # cache and job queue only, nothing worth persisting
  redis:
    image: docker.io/library/redis:8-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres:
